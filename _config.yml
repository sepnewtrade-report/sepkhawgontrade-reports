# Disable Jekyll layout template rendering for pure static files
theme: null
safe: true
markdown: kramdown
highlighter: rouge

defaults:
  - scope:
      path: ""
    values:
      layout: null

exclude:
  - venv/
  - pipeline/
  - scratch/
  - ".agents/"
  - ".gemini/"
  - ".git/"
  - "*.py"
  - "*.db"
  - "*.log"
  - "*.txt"
  - "*.sh"
