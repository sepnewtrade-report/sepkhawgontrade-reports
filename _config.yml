# Disable Liquid template rendering for raw static publishing
theme: null
safe: true
render_with_liquid: false
plugins: []

exclude:
  - venv/
  - test_venv/
  - tmp_venv/
  - pipeline/
  - scratch/
  - automation/
  - notebooklm-manager/
  - "MEMBERSHIP CONTENT SYSTEM/"
  - ".agents/"
  - ".gemini/"
  - ".git/"
  - "*.py"
  - "*.db"
  - "*.log"
  - "*.sh"
  - "*.txt"
