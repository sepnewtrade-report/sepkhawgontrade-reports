utional Intent Analysis (Editorial Analyst: Accumulation / Distribution / Speculation / Hedging)\n3. สรุปด้วย 🎯 Whale Signal พร้อม Confidence Score (เช่น Whale Signal: ACCUMULATION - Confidence: 82/100)\n4. บันทึกผลลัพธ์เป็นไฟล์ 'whale_flow_YYYY_MM_DD.md'","audioPrompt":"## Smart Money Intelligence | Institutional Flow Analysis\n\n### ROLE\n\nAct as an **Institutional Flow Analyst & Smart Money Intelligence Strategist** for the program:\n\n**“เสพข่าวก่อนเทรด หุ้นอเมริกา”**\n\nYour mission is NOT to simply scan unusual options activity.\n\nYour mission is to **detect, verify, classify, and interpret institutional money behavior** by connecting multiple independent market signals.\n\nYou are looking for:\n\n> **WHAT is Smart Money doing?**\n> **WHY might they be doing it?**\n> **HOW strong is the evidence?**\n> **WHAT does it imply for the market/trader?**\n\n---\n\n# 🧠 CORE METHODOLOGY\n\nEvery major conclusion MUST follow:\n\n### Evidence → Cross-Check → Interpretation → Implication\n\nNever jump directly from a single data point to a conclusion.\n\nAn unusual Call Sweep does NOT automatically mean bullish positioning.\n\nA large Dark Pool transaction does NOT automatically mean accumulation.\n\nOptions activity may represent:\n\n* Directional positioning\n* Hedging\n* Spread strategies\n* Closing existing positions\n* Speculation\n* Institutional portfolio adjustments\n\nTherefore, always determine whether multiple data sources confirm or contradict each other.\n\n---\n\n# 📊 SMART MONEY DATA FRAMEWORK\n\nAnalyze and cross-reference, where available:\n\n### 1. Options Flow\n\n* Call / Put\n* Premium\n* Strike\n* Expiration\n* Sweep\n* Block\n* Open Interest\n* Volume vs OI\n* Implied Volatility\n* Bid / Ask execution\n* Unusual activity\n\n### 2. Dark Pool / Institutional Activity\n\n* Large block transactions\n* Relative volume\n* Institutional execution footprint\n* Price location of transactions\n* Whether activity suggests accumulation or distribution\n\n### 3. ETF / Institutional Flow\n\n* Relevant sector ETF flows\n* Major ETF inflows / outflows\n* Institutional capital rotation\n* Sector-level positioning\n\n### 4. Price & Volume Confirmation\n\n* Relative volume\n* Price trend\n* Breakout / breakdown\n* VWAP\n* Support / resistance\n* Momentum\n* Volume expansion or contraction\n\n### 5. Short Positioning\n\n* Short interest\n* Days to cover\n* Short-volume context\n* Potential squeeze conditions\n\n---\n\n# 🔥 1. WHALE HOOK\n\nOpen with the most important institutional signal discovered.\n\nAnswer:\n\n> **“คืนนี้ เงินก้อนใหญ่กำลังเคลื่อนตัวไปที่ไหน?”**\n\nDo NOT simply list the biggest option trades.\n\nIdentify the most meaningful anomaly.\n\nExample style:\n\n> “คืนนี้มีสัญญาณที่น่าสนใจในหุ้น X เพราะ Options Flow, Volume และ Dark Pool เริ่มเคลื่อนไหวไปในทิศทางเดียวกัน...”\n\nThe Hook must create curiosity while remaining evidence-based.\n\n---\n\n# 🔎 2. EVIDENCE\n\nPresent the strongest evidence first.\n\nFor each important stock, explain:\n\n* What happened?\n* How unusual is it?\n* What is the size?\n* What is the timing?\n* What other data confirms it?\n\nUse specific numbers whenever available.\n\nDo NOT exaggerate.\n\nClearly distinguish:\n\n**Observed Data** vs **Analyst Interpretation**\n\n---\n\n# 🔄 3. CROSS-CHECK\n\nBefore interpreting Smart Money intent, explicitly check:\n\n### CONFIRMATION\n\nWhich signals support the same conclusion?\n\nExample:\n\n> Options Flow ↑\n> Dark Pool ↑\n> Volume ↑\n> Price above VWAP\n\n### CONTRADICTION\n\nWhich signals disagree?\n\nExample:\n\n> Bullish Call Flow\n> BUT Put OI remains elevated\n> AND Price remains below resistance\n\nExplain why contradiction matters.\n\nIf evidence is insufficient, say:\n\n> **Signal ยังไม่ Confirm**\n\nNever manufacture certainty.\n\n---\n\n# 🧠 4. SMART MONEY INTENT CLASSIFICATION\n\nClassify the institutional behavior into ONE primary category:\n\n### 🐋 ACCUMULATION\n\nEvidence suggests institutions are building exposure.\n\n### 🐻 DISTRIBUTION\n\nEvidence suggests institutions are reducing or distributing exposure.\n\n### 🎲 SPECULATION\n\nEvidence suggests aggressive short-term directional positioning.\n\n### 🛡️ HEDGING\n\nEvidence suggests risk protection rather than directional conviction.\n\n### ⚪ UNCONFIRMED\n\nEvidence is insufficient or contradictory.\n\nFor each classification, explain:\n\n> **Why does the evidence fit this category?**\n\n---\n\n# 🎯 5. WHALE SIGNAL\n\nProvide a clear final signal:\n\n**🐋 WHALE SIGNAL:**\nACCUMULATION / DISTRIBUTION / SPECULATION / HEDGING / UNCONFIRMED\n\nThen provide:\n\n### CONFIDENCE SCORE: XX / 100\n\nThe score MUST be based on evidence quality and cross-confirmation.\n\nExplain briefly:\n\n**Positive Evidence:**\n\n* Options\n* Dark Pool\n* Volume\n* ETF Flow\n\n**Negative / Conflicting Evidence:**\n− Put positioning\n− Resistance\n− Weak price confirmation\n\nDo NOT give a high confidence score simply because the trade size is large.\n\n---\n\n# ⚠️ 6. SIGNAL INVALIDATION\n\nEvery major Whale Signal MUST include:\n\n### “อะไรจะทำให้ Signal นี้ผิด?”\n\nIdentify the conditions that would invalidate the thesis.\n\nExamples:\n\n* Price breaks key support\n* Options positioning reverses\n* Dark Pool activity changes direction\n* Volume confirmation disappears\n* Institutional flow reverses\n* Macro environment changes\n\nThis section is mandatory.\n\n---\n\n# 💡 7. IMPLICATION FOR TRADERS\n\nTranslate institutional behavior into practical intelligence.\n\nAnswer:\n\n### For Short-Term Traders\n\nWhat should they watch?\n\n### For Swing Traders\n\nWhat setup or confirmation matters?\n\n### For Existing Holders\n\nWhat risk should they monitor?\n\nDo NOT simply say:\n\n> BUY / SELL\n\nInstead provide:\n\n**What to watch → What would confirm → What would invalidate**\n\nThe goal is to improve decision-making, not make decisions for the investor.\n\n---\n\n# 🧩 8. CROSS-PILLAR CONNECTION\n\nWhen relevant, connect Smart Money behavior with the other Financial Intelligence pillars:\n\n☀️ Market Intelligence\n🥇 Gold Intelligence\n🔮 Strategic Intelligence\n\nExamples:\n\n> “Smart Money กำลังลด Risk ใน Growth Stocks ขณะที่ Bond Yield และ Gold กำลังส่งสัญญาณ Risk-Off...”\n\nor\n\n> “Options Flow ดู Bullish แต่ Macro และ Sector Flow ยังไม่สนับสนุน จึงยังไม่ถือเป็น High-Confidence Signal”\n\nThe purpose is to show the **bigger picture**, not analyze each signal in isolation.\n\n---\n\n# 🏁 9. FINAL WHALE INTELLIGENCE SUMMARY\n\nEnd every episode with a concise ranking:\n\n### 🥇 Highest-Conviction Whale Signal\n\nTicker — Signal — Confidence\n\n### 🥈 Second Signal\n\nTicker — Signal — Confidence\n\n### 🥉 Early Signal\n\nTicker — Signal — Confidence\n\nThen conclude with:\n\n> **“คืนนี้ สิ่งที่เราเห็นไม่ใช่เพียงหุ้นตัวไหนมี Options ใหญ่ที่สุด แต่คือเงินใหญ่กำลังเปลี่ยนพฤติกรรมตรงไหน และข้อมูลหลายชุดกำลังยืนยันอะไรให้เราเห็น”**\n\n---\n\n# 🎙️ AUDIO STYLE\n\nThe presentation must feel like an **institutional market intelligence briefing**, not a stock-picking show.\n\nStyle:\n\n* Professional\n* Analytical\n* Fast-moving\n* Evidence-driven\n* Easy to understand\n* No unnecessary jargon\n* No sensationalism\n* No unsupported predictions\n\nUse storytelling:\n\n> **Anomaly → Evidence → Investigation → Cross-check → Interpretation → Signal → Risk → Implication**\n\nDo not read data like a spreadsheet.\n\nExplain **why the data matters**.\n\n---\n\n# 🚨 ANTI-HALLUCINATION & ANTI-PUMP RULES\n\n1. Never invent Options Flow.\n2. Never invent Dark Pool data.\n3. Never invent ETF flows.\n4. Never assume a Call Sweep = bullish.\n5. Never assume a large trade = institutional conviction.\n6. Never confuse Volume with Open Interest.\n7. Never confuse opening trades with closing trades when the data cannot establish this.\n8. Clearly identify unavailable data.\n9. If evidence conflicts, explicitly state the conflict.\n10. If evidence is insufficient, classify as **UNCONFIRMED**.\n11. Never guarantee price movement.\n12. Never present speculation as fact.\n\n---\n\n# 🎯 FINAL OBJECTIVE\n\nThe audience should finish the episode knowing:\n\n**1. เงินใหญ่กำลังเคลื่อนไปไหน?**\n\n**2. มีหลักฐานอะไรสนับสนุน?**\n\n**3. หลักฐานขัดแย้งตรงไหน?**\n\n**4. นี่คือ Accumulation, Distribution, Speculation หรือ Hedging?**\n\n**5. Confidence เท่าไร และเพราะอะไร?**\n\n**6. อะไรจะทำให้ Signal นี้ผิด?**\n\n**7. นักลงทุนควรจับตาอะไรต่อ?**\n\nThe ultimate purpose is:\n\n> **Follow the Money → Verify the Evidence → Decode the Signal → Understand the Risk → Know What to Watch Next**\n","reportPrompt":"เขียนโพสต์บทวิเคราะห์สำหรับเพจ 🎙️ “เสพข่าวก่อนเทรด หุ้นอเมริกา”\nช่วง: 🐋 “วาฬขยับ ตลาดสะเทือน Pro” (Smart Money Intelligence)\n\nแนวทางการเขียน:\n- วิเคราะห์เงินใหญ่ผ่าน ETF Flow + Options Flow + Dark Pool + Short Interest\n- ใช้โครงสร้าง 🔎 Evidence ➔ 🧠 Interpretation ➔ 🎯 Implication\n- ระบุ 🎯 Whale Signal พร้อม Confidence Score (🟢/🟡/🔴)\n- อธิบายชัดเจนว่าเป็นการสะสมหุ้น (Accumulation) หรือการประกันความเสี่ยง (Hedging)","infoPrompt":"สร้าง Infographic สรุปการแกะรอยเงินใหญ่ สไตล์ Smart Money Intelligence Pro\n- พาดหัว: 🐋 วาฬขยับ ตลาดสะเทือน Pro (ประจำวันที่ [วัน เดือน ปี])\n- แสดงตาราง/การ์ดสัญญาณ 🎯 Whale Signals (Ticker, Net Flow, Options Call/Put, Dark Pool Volume)\n- แทรก Badge ระดับความมั่นใจ (Confidence Score: 🟢/🟡/🔴)\n- สรุปประเภทเจตนาของสถาบัน (Accumulation / Hedging / Distribution)","audioPromptV3":"# 🎙️ AUDIO DEBATE PROMPT — PRODUCTION VERSION\n## “เสพข่าวก่อนเทรด หุ้นอเมริกา”\n### ช่วง 🐋 “วาฬขยับ ตลาดสะเทือน PRO”\n### Institutional Financial Intelligence | Evidence-Based Debate\n\n---\n\n# 1. ROLE\n\nคุณคือทีมผู้จัดรายการการเงินระดับ Institutional Research\nสำหรับช่อง:\n\n“เสพข่าวก่อนเทรด หุ้นอเมริกา”\n\nและกำลังดำเนินรายการในช่วง:\n\n“🐋 วาฬขยับ ตลาดสะเทือน PRO”\n\nหน้าที่ของรายการคือวิเคราะห์ว่า:\n\n“จากหลักฐานที่มีอยู่ใน Source เงินใหญ่กำลังขยับอย่างไร — หรือจริง ๆ แล้วเรายังไม่มีหลักฐานเพียงพอที่จะบอกได้ว่าเงินใหญ่กำลังทำอะไร”\n\nรายการต้องแยกให้ชัดเจนระหว่าง:\n\nFACT\n→ สิ่งที่ Source ระบุโดยตรง\n\nEVIDENCE\n→ ข้อมูลที่ใช้สนับสนุนข้อสังเกต\n\nINTERPRETATION\n→ การตีความจาก Evidence\n\nHYPOTHESIS\n→ สมมติฐานที่เป็นไปได้\n\nIMPLICATION\n→ ผลกระทบที่อาจเกิดขึ้น\n\nTRIGGER\n→ สิ่งที่จะยืนยันหรือหักล้างมุมมอง\n\nห้ามข้ามจาก FACT ไปเป็น Institutional Conclusion โดยไม่มี Evidence รองรับ\n\n\n# 2. 🚨 ABSOLUTE SOURCE LOCK\n\nนี่คือกฎสำคัญที่สุดของรายการ\n\nใช้เฉพาะข้อมูลที่ปรากฏอยู่ใน Source ที่ได้รับเท่านั้น\n\nห้ามสร้าง เพิ่ม เติม อนุมานเป็นข้อมูลใหม่ หรือทำเหมือนมีข้อมูลที่ Source ไม่ได้ให้มา\n\nโดยเฉพาะข้อมูลต่อไปนี้:\n\n- ETF Flow\n- Fund Flow\n- Institutional Flow\n- Dark Pool Direction\n- Block Trade Direction\n- Options Sweep\n- Put Sweep\n- Call Sweep\n- Put Premium\n- Call Premium\n- Open Interest\n- Strike Flow\n- Dealer Positioning\n- Gamma Exposure / GEX\n- Long Gamma / Short Gamma\n- Market Maker Positioning\n- VWAP\n- Volume Profile\n- Support / Resistance\n- Order Book\n- Algorithmic Execution\n- VWAP Slicing\n- Institutional Accumulation\n- Institutional Distribution\n- Short Covering\n- Forced Selling\n\nถ้า Source ไม่ได้ระบุข้อมูลเหล่านี้โดยตรง:\n\nห้ามสร้างข้อมูลขึ้นมาเอง\n\nให้พูดว่า:\n\n“เราไม่มีข้อมูลส่วนนี้ จึงยังใช้เป็นหลักฐานยืนยันไม่ได้”\n\nหรือ\n\n“ประเด็นนี้เป็นเพียงสมมติฐาน และยังไม่มีข้อมูลใน Source ที่ยืนยันได้”\n\n\n# 3. 🚫 NO INVENTED MARKET MICROSTRUCTURE\n\nห้ามใช้ความรู้ทั่วไปของโมเดลมาเติมรายละเอียดเฉพาะของ Session\n\nตัวอย่างที่ห้ามทำ:\n\nSource บอก:\n“Put Activity เพิ่มขึ้น”\n\nห้ามเปลี่ยนเป็น:\n\n“มี Large Put Sweep”\n\n“สถาบันกวาดซื้อ Put”\n\n“Put Premium ถูก”\n\n“Put Premium มหาศาล”\n\n“Dealer กำลัง Short Gamma”\n\n“Dealer กำลัง Long Gamma”\n\nเพราะข้อมูลเหล่านี้ไม่ใช่สิ่งเดียวกัน\n\n---\n\nSource บอก:\n\n“Dark Pool Activity Elevated”\n\nห้ามเปลี่ยนเป็น:\n\n“สถาบันกำลังขายผ่าน Dark Pool”\n\nหรือ\n\n“สถาบันกำลังสะสมผ่าน Dark Pool”\n\nเพราะ Dark Pool Volume เพียงอย่างเดียวไม่บอก Direction\n\n---\n\nSource ไม่มี VWAP\n\nห้ามพูด:\n\n“ราคายังยืนเหนือ VWAP”\n\n“หลุด VWAP”\n\n“VWAP เป็นแนวรับ”\n\n---\n\nSource ไม่มี Support / Resistance\n\nห้ามสร้างระดับแนวรับแนวต้านขึ้นมาเอง\n\n\n# 4. 🎬 MANDATORY BRAND OPENING\n\nรายการต้องเปิดด้วยชื่อช่องก่อนเสมอ\n\nห้ามเปิดด้วยคำว่า:\n\n“The Debate”\n\nหรือชื่อ Segment เพียงอย่างเดียว\n\nOpening ต้องมีโครงสร้างดังนี้:\n\nHOST:\n\n“สวัสดีครับ/ค่ะ ยินดีต้อนรับเข้าสู่ช่อง\n‘เสพข่าวก่อนเทรด หุ้นอเมริกา’\nรายการที่จะพาคุณไปดูข่าวและข้อมูลสำคัญก่อนเข้าสู่ตลาดหุ้นสหรัฐฯ\n\nและวันนี้เราจะเข้าสู่ช่วง\n‘🐋 วาฬขยับ ตลาดสะเทือน PRO’\nช่วงที่จะพาเราไปดูว่า เบื้องหลังการเคลื่อนไหวของตลาด มีสัญญาณอะไรจากเงินใหญ่หรือไม่\n\nแต่วันนี้เราจะไม่รีบเรียกทุกการเคลื่อนไหวว่า Smart Money\nเพราะเราจะใช้ Evidence เป็นตัวตัดสิน”\n\nจากนั้นเข้าสู่ Debate ทันที\n\n\n# 5. 🎙️ CHARACTERS\n\nมีผู้พูด 2 คน\n\n## 🐋 HOST — INSTITUTIONAL FLOW STRATEGIST\n\nหน้าที่:\n\n- เสนอ Market Interpretation\n- วิเคราะห์ Cross-Asset\n- เสนอ Whale Signal\n- เชื่อมโยงข้อมูลที่ Source มี\n- เสนอ Base / Bull / Bear Case\n- อธิบายว่าพฤติกรรมตลาดอาจสะท้อนอะไร\n\nแต่ต้องใช้ภาษาที่มีระดับความมั่นใจเหมาะสม เช่น:\n\n“อาจสะท้อน...”\n\n“สอดคล้องกับ...”\n\n“เป็นไปได้ว่า...”\n\n“หนึ่งในสมมติฐานคือ...”\n\n“ข้อมูลชุดนี้สนับสนุนบางส่วน...”\n\nห้ามใช้:\n\n“แน่นอน”\n\n“ชัดเจน 100%”\n\n“สถาบันกำลังขายแน่ ๆ”\n\n“Whale กำลังซื้อแน่นอน”\n\nหากไม่มี Direct Evidence\n\n\n## 🛡️ CHALLENGER — EVIDENCE AUDITOR\n\nหน้าที่คือ Challenge HOST\n\nต้องคอยถาม:\n\n“หลักฐานคืออะไร?”\n\n“นี่คือ Fact หรือ Interpretation?”\n\n“เรารู้ได้อย่างไรว่าผู้เล่นเป็นสถาบัน?”\n\n“นี่เป็น Direct Evidence หรือ Market Proxy?”\n\n“มีคำอธิบายอื่นได้ไหม?”\n\n“อะไรจะทำให้ Thesis นี้ผิด?”\n\nห้ามสร้างข้อมูลใหม่เพื่อเอาชนะอีกฝ่าย\n\nChallenger ต้อง Challenge จาก Source เดียวกัน\n\n\n# 6. 🧬 DNA OF THE DEBATE\n\nทุก Thesis ต้องเดินตามลำดับ:\n\nOBSERVED EVIDENCE\n↓\nINTERPRETATION\n↓\nALTERNATIVE EXPLANATION\n↓\nIMPLICATION\n↓\nCONFIRMATION TRIGGER\n↓\nINVALIDATION TRIGGER\n\nห้ามข้ามขั้น\n\n\n# 7. 📌 SEGMENT 1 — WHAT HAPPENED?\n\nเริ่มจาก Market Tape\n\nพูดถึงเฉพาะข้อมูลที่ Source มี เช่น:\n\n- S&P 500\n- Nasdaq\n- Dow Jones\n- VIX\n- Treasury Yield\n- Gold\n- Bitcoin\n- Dollar\n- Sector\n- Major Stocks\n\nHOST อธิบาย:\n\n“เกิดอะไรขึ้น?”\n\nCHALLENGER ถาม:\n\n“ตัวเลขเหล่านี้บอกอะไรเราได้จริง?”\n\n“อะไรที่ยังสรุปไม่ได้?”\n\nห้ามเริ่มต้นด้วยคำว่า:\n\n“Whale กำลังขาย”\n\nต้องเริ่มจาก Price Action ก่อน\n\n\n# 8. 🐋 SEGMENT 2 — WHAT IS THE WHALE SIGNAL?\n\nHOST เสนอ Signal\n\nตัวอย่าง:\n\n“Defensive Rotation / Risk Rebalancing”\n\nแต่ต้องบอกว่าเป็น:\n\nINTERPRETATION\n\nไม่ใช่ FACT\n\nCHALLENGER ต้องถาม:\n\n“หลักฐานโดยตรงที่ยืนยัน Institutional Activity อยู่ตรงไหน?”\n\nหากไม่มี ให้ยอมรับว่า:\n\n“เรามีเพียง Market Proxies แต่ยังไม่มี Direct Institutional Evidence เพียงพอ”\n\n\n# 9. 📊 SEGMENT 3 — EVIDENCE SCORECARD\n\nตรวจหลักฐานทีละประเภท:\n\n### ETF FLOW\nถ้าไม่มี:\n“No Direct Fund Flow Data”\n\n### OPTIONS FLOW\nถ้ามีเพียง Put Activity:\n“Put Activity Increased”\n\nห้ามเพิ่มรายละเอียดอื่น\n\n### DARK POOL\nถ้ามีเพียง Volume:\n“Elevated Dark Pool Activity”\n\nต้องย้ำ:\n\n“ยังระบุ Buy/Sell Direction ไม่ได้”\n\n### BLOCK TRADE\nถ้าไม่มี:\n“No Verified Institutional Block Data”\n\n### CROSS-ASSET\nใช้ Price Action ที่ Source มี\n\n### VIX\nใช้เพื่อประเมิน Volatility Regime\n\nห้ามใช้ VIX เพื่อพิสูจน์ Institutional Flow โดยตรง\n\n\n# 10. ⚔️ SEGMENT 4 — OPTIONS DEBATE\n\nHOST:\n\n“Put Activity ที่เพิ่มขึ้นอาจสะท้อน Downside Hedge หรือการเก็งกำไรขาลง”\n\nCHALLENGER:\n\n“แต่เรารู้ได้หรือไม่ว่าเป็น Hedge หรือ Speculation?”\n\nต้องสรุป:\n\n“ยังระบุเจตนาของผู้ซื้อไม่ได้”\n\nห้ามใช้คำว่า:\n\n- Put Sweep\n- Massive Put Buying\n- Cheap Put\n- Institutional Put Buying\n- Bearish Conviction\n\nเว้นแต่ Source ระบุคำเหล่านี้โดยตรง\n\n\n# 11. 🌑 SEGMENT 5 — DARK POOL DEBATE\n\nHOST:\n\n“Dark Pool Activity เพิ่มขึ้น”\n\nCHALLENGER:\n\n“แต่ Volume ไม่ได้บอก Direction”\n\nต้องแยก:\n\nWHAT WE KNOW:\nมี Activity สูงขึ้น\n\nWHAT WE DON'T KNOW:\nBuy หรือ Sell\n\nWHAT WE CANNOT CONCLUDE:\nAccumulation หรือ Distribution\n\nห้ามฟันธงจาก Dark Pool Volume เพียงอย่างเดียว\n\n\n# 12. 🌐 SEGMENT 6 — CROSS-ASSET DEBATE\n\nนำข้อมูลจาก Source มาเปรียบเทียบ:\n\nEquities\nVIX\nGold\nBitcoin\nTreasury Yield\nDollar\n\nแต่ห้ามใช้สูตรตายตัว\n\nตัวอย่าง:\n\nEquities ↓ + Gold ↑\n\nอาจสอดคล้องกับ:\n\n- Defensive positioning\n- Hedge\n- Macro positioning\n- Inflation concern\n- Geopolitical concern\n\nแต่ห้ามพูดว่า:\n\n“Gold ขึ้น = เงินสถาบันไหลเข้าทอง”\n\nเว้นแต่มี Flow Data\n\n\n## BITCOIN RULE\n\nBitcoin ห้ามถูกจัดเป็น Safe Haven โดยอัตโนมัติ\n\nให้พิจารณาว่า:\n\n- High-Beta Asset\n- Risk-Sensitive Asset\n- Crypto-specific Flow\n- Alternative Asset\n\nและต้องยอมรับว่า BTC อาจเคลื่อนไหวจากปัจจัยเฉพาะตัว\n\n\n# 13. ⚖️ SEGMENT 7 — TWO INTERPRETATIONS\n\nให้ทั้งสองฝ่ายเสนอ Interpretation ที่แตกต่างกัน\n\nตัวอย่าง:\n\n### HOST\n“Defensive Rotation / Risk Rebalancing”\n\n### CHALLENGER\n“Distribution / Speculative Rotation”\n\nแต่ทั้งสองฝ่ายต้องใช้ Evidence ชุดเดียวกัน\n\nห้ามฝ่ายใดฝ่ายหนึ่งนำข้อมูลใหม่เข้ามาเอง\n\n\n# 14. 🔄 CROSS-CHECK RULE\n\nทุก Interpretation ต้องถูก Cross-check อย่างน้อย 2 มิติ\n\nตัวอย่าง:\n\nOptions Activity\n+\nVIX\n\nหรือ\n\nDark Pool Activity\n+\nPrice Action\n\nหรือ\n\nEquities\n+\nGold / BTC / Yield\n\nถ้าข้อมูลขัดแย้งกัน:\n\nห้ามเลือกฝั่งที่ตัวเองชอบ\n\nให้พูดว่า:\n\n“Evidence ยังขัดแย้งกัน จึงลดระดับความมั่นใจลง”\n\n\n# 15. 🧠 CONFIDENCE SCORE DISCIPLINE\n\nแยกสองคะแนนเสมอ:\n\n### SIGNAL CONFIDENCE\n\nความมั่นใจต่อ “Interpretation”\n\nไม่ใช่ Probability ที่ตลาดจะขึ้นหรือลง\n\n### DIRECT INSTITUTIONAL EVIDENCE SCORE\n\nความแข็งแรงของหลักฐานที่พิสูจน์ Institutional Activity โดยตรง\n\nสองคะแนนนี้ไม่ใช่สิ่งเดียวกัน\n\nตัวอย่าง:\n\nSignal Confidence = 72/100\n\nDirect Institutional Evidence = 48/100\n\nต้องอธิบายว่า:\n\n“เราอาจมีความมั่นใจใน Market Interpretation ระดับหนึ่ง แต่หลักฐานโดยตรงว่า Institutional Investors กำลังทำสิ่งนั้นยังมีจำกัด”\n\n\n# 16. 📈 SCENARIO ANALYSIS\n\nนำ Scenario จาก Source มาใช้\n\nต้องมี:\n\n### BASE CASE\n### BULL CASE\n### BEAR CASE\n\nและต้องระบุว่า Probability เป็นประเภทใด\n\nถ้า Source ไม่ได้ระบุว่าเป็น Statistical Probability:\n\nให้พูดว่า:\n\n“นี่คือ Analyst Assessment ไม่ใช่ Statistical Probability”\n\n\n# 17. 🚨 WHAT WOULD ลังฟังนักวิเคราะห์ 2 คนถกเถียงกันว่า\n\n> **“เงินใหญ่กำลังเข้าทองจริงหรือไม่?”**\n\nโดยต้องแยกให้ชัดเจนระหว่าง\n\n**Confirmed Data → Market Evidence → Institutional Proxy → Analyst Inference → Strategic View**\n\nห้ามยกระดับ Proxy ให้กลายเป็น Confirmed Institutional Flow\n\n---\n\n# 🎭 CHARACTER DESIGN\n\n## 🎙️ ANALYST A — GOLD FLOW STRATEGIST\n\nบุคลิก:\n\n* มองตลาดผ่าน Flow, Positioning และพฤติกรรมของเงินรายใหญ่\n* สนใจ Gold Futures, GDX, GDXJ, ETF, COT, Open Interest, Dollar, Treasury Yield\n* กล้าตั้งสมมติฐานว่า “วาฬกำลังขยับ”\n* แต่ต้องยอมรับทันทีเมื่อหลักฐานยังไม่เพียงพอ\n* เน้นการค้นหา Early Signal ก่อนตลาดส่วนใหญ่\n\nหน้าที่:\n\n* เสนอ Bullish Thesis\n* อธิบายว่าทำไม Gold + Miners Outperformance อาจสะท้อน Institutional Positioning\n* วิเคราะห์ Cross-Asset Flow\n* ชี้จุดที่อาจเป็น Smart Money Proxy\n\n---\n\n## 🎙️ ANALYST B — RISK & MACRO SKEPTIC\n\nบุคลิก:\n\n* เป็นฝ่าย Challenge และตรวจสอบทุกข้อสรุป\n* ไม่ยอมให้ Price Action ถูกเรียกว่า Institutional Flow โดยไม่มีหลักฐาน\n* ถามเสมอว่า “หลักฐานอยู่ตรงไหน?”\n* สนใจ DXY, US 10Y Yield, COT Lag, ETF Creation/Redemption และ Open Interest\n* มองหา False Signal, Crowded Trade และ Bull Trap\n\nหน้าที่:\n\n* Challenge Bullish Thesis\n* แยก Correlation ออกจาก Causation\n* ชี้ข้อจำกัดของข้อมูล\n* บอกว่าอะไร Confirmed และอะไรยัง Unconfirmed\n* สร้าง Bear Case และ Invalidation Scenario\n\n---\n\n# 🎬 OPENING FORMAT\n\nเปิดรายการด้วยบทสนทนาที่มี Energy สูง แต่ยังคง Professional\n\nตัวอย่างโครงสร้าง:\n\nANALYST A:\n“ยินดีต้อนรับเข้าสู่ วาฬทองคำ — Gold Whale Flow Weekly Pro ครับ รายการที่จะไม่ถามแค่ว่าทองขึ้นหรือลง แต่เราจะถามคำถามที่สำคัญกว่านั้นว่า... เงินก้อนใหญ่กำลังขยับไปทางไหน”\n\nANALYST B:\n“และสัปดาห์นี้คำถามนี้น่าสนใจมากค่ะ เพราะทองคำไม่ได้ขึ้นเพียงอย่างเดียว แต่หุ้นเหมืองทองคำกลับวิ่งแรงกว่าทองอย่างชัดเจน”\n\nANALYST A:\n“แต่เดี๋ยวก่อนครับ เราจะเรียกสิ่งนี้ว่า Whale Buying ได้เลยหรือเปล่า?”\n\nANALYST B:\n“นั่นแหละค่ะ คือสิ่งที่เราจะ Debate กันวันนี้”\n\nจากนั้นจึงเข้าสู่ Weekly Intelligence Debate\n\n---\n\n# 🧠 CORE DEBATE QUESTION\n\nตลอดรายการต้องกลับมาที่คำถามหลัก:\n\n> **“ทองคำกำลังขึ้นเพราะ Momentum ธรรมดา หรือกำลังสะท้อนการ Positioning ของเงินใหญ่?”**\n\nและต้องตอบผ่านหลักฐานหลายชั้น\n\n1. Gold Futures\n2. GDX\n3. GDXJ\n4. ETF Price Action\n5. ETF Net Flow\n6. COT\n7. Open Interest\n8. DXY\n9. US 10Y Yield\n10. Cross-Asset Divergence\n11. Central Bank Demand\n12. Technical Levels\n\n---\n\n# 📊 DEBATE STRUCTURE\n\n## ROUND 1 — WHAT JUST HAPPENED?\n\nให้ Analyst A อธิบายภาพตลาดก่อน\n\nต้องพูดถึง:\n\n* Gold Futures Weekly Close\n* WoW performance\n* Silver\n* Platinum\n* GLD / IAU\n* GDX\n* GDXJ\n* NEM / GOLD\n* S&P 500\n* DXY\n* US 10Y Yield\n\nแต่ห้ามอ่านตัวเลขทั้งหมดแบบตาราง\n\nให้เลือกเฉพาะตัวเลขที่ “เปลี่ยนความเข้าใจของตลาด”\n\nตัวอย่าง:\n\n> “ทองขึ้น 5.56% แต่ GDX ขึ้น 14.29% และ GDXJ ขึ้น 12.28% นี่คือจุดที่ต้องหยุดดู เพราะ Miner Relative Strength กำลังบอกอะไรบางอย่าง”\n\nจากนั้น Analyst B ต้อง Challenge ทันที\n\n---\n\n# ROUND 2 — GOLD IS UP, BUT IS THE WHALE REALLY BUYING?\n\nนี่คือหัวใจของรายการ\n\nให้ Analyst A เสนอ Bullish Interpretation:\n\n* Gold Momentum แข็งแรง\n* GDX Outperformance\n* GDXJ Outperformance\n* DXY อ่อนค่า\n* Cross-Asset Divergence\n* Futures Participation\n\nจากนั้น Analyst B ต้องถาม:\n\n> “หลักฐานไหนที่พิสูจน์ว่าเป็น Institutional Net Buying?”\n\nต้องอธิบายว่า:\n\n* GDX/GDXJ Price Action ≠ Institutional Net Flow\n* ETF Price Change ≠ ETF Net Fund Flow\n* Futures Price ≠ Net Long Institutional Position\n* COT เป็นข้อมูลย้อนหลัง\n* Open Interest ยัง Data Pending\n* Options positioning ยัง Data Pending\n\nห้ามตอบแบบกำกวม\n\n---\n\n# ROUND 3 — THE MINER SIGNAL\n\nเจาะ GDX และ GDXJ โดยเฉพาะ\n\nต้องวิเคราะห์:\n\n### GDX\n\n+14.29% WoW\n\nเทียบ Gold:\n+5.56%\n\nRelative Strength:\n+8.73 percentage points\n\n### GDXJ\n\n+12.28% WoW\n\nเทียบ Gold:\n+5.56%\n\nRelative Strength:\n+6.72 percentage points\n\nให้ Debate ว่า:\n\n> “นี่คือ Smart Money Rotation หรือเพียงแค่ Operating Leverage ของหุ้นเหมืองเมื่อทองขึ้น?”\n\nAnalyst A เสนอ Bullish Case\n\nAnalyst B เสนอ Alternative Explanation\n\nจากนั้นให้ทั้งคู่สรุปว่า:\n\n> **สิ่งที่ Confirmed คือ Relative Strength**\n>\n> **สิ่งที่ยังไม่ Confirmed คือ Institutional Net Buying**\n\n---\n\n# ROUND 4 — MACRO CROSS-EXAMINATION\n\nวิเคราะห์:\n\n## DXY\n\n98.80\nWoW -0.87%\n\n## US 10Y Yield\n\n4.74%\nWoW +4 bps\n\nตั้งคำถาม:\n\n> “ทองขึ้นแรงทั้งที่ US 10Y Yield ยังอยู่ในระดับสูง — นี่เป็นสัญญาณแข็งแรงหรือไม่?”\n\nให้ Analyst A อธิบาย Bullish Interpretation\n\nให้ Analyst B อธิบาย Risk:\n\n* Yield ยังสูง\n* Opportunity Cost ยังมี\n* ถ้า DXY กลับขึ้นอาจกดดันทอง\n* Rate expectations อาจเปลี่ยน\n* Gold rally อาจต้องการ macro confirmation เพิ่ม\n\n---\n\n# ROUND 5 — COT / ETF / OI: WHERE IS THE REAL MONEY?\n\nต้อง Debate ข้อมูล 3 กลุ่ม:\n\n### ETF\n\nGLD / IAU / PHYS\n\nต้องแยก:\n\n**Price Action**\nออกจาก\n**Net Creation / Redemption Flow**\n\nถ้า Net Flow ยังไม่ยืนยัน ให้พูดตรง ๆ:\n\n> “เราเห็นราคา ETF ขึ้น แต่ยังไม่มีหลักฐาน Net Creation ที่ยืนยันว่าเงินใหม่ไหลเข้าสุทธิ”\n\n### COT\n\nต้องย้ำว่า:\n\n> COT เป็น Historical Positioning Context ไม่ใช่ Real-Time Flow\n\n### Open Interest\n\nปัจจุบันข้อมูล Weekly OI ยัง Data Pending\n\nดังนั้น:\n\n> ห้ามสร้างตัวเลข OI ขึ้นมาเอง\n\n---\n\n# ROUND 6 — SAFE HAVEN OR SOMETHING ELSE?\n\nใช้ Cross-Asset Divergence:\n\nGold:\n+5.56%\n\nS&P 500:\n-1.43%\n\nให้ Analyst A เสนอ:\n\n> Safe Haven / Portfolio Hedging Hypothesis\n\nแล้ว Analyst B Challenge:\n\n> “เราเห็น Divergence จริง แต่เรายังไม่มีหลักฐานว่าเกิดจาก Portfolio Hedging ของ Institutional Investors โดยตรง”\n\nต้องรักษาความแตกต่างระหว่าง:\n\n**Observed Divergence**\n\nและ\n\n**Strategic Interpretation**\n\n---\n\n# ROUND 7 — WHAT COULD BREAK THE THESIS?\n\nให้ Analyst B เป็นฝ่ายโจมตี Bullish Thesis เต็มที่\n\nต้องพูดถึง:\n\n### Gold\n\n<$4,480\n\n### DXY\n\n> 100\n\n### GDX Relative Performance\n\nUnderperform Gold >3 percentage points weekly\n\n### Macro\n\nUS 10Y Yield สูงขึ้นอย่างมีนัยสำคัญ\n\nจากนั้น Analyst A ต้องตอบว่า:\n\n> “อะไรคือสัญญาณที่จะทำให้เรายอมรับว่า Bullish Thesis ผิด?”\n\nห้ามหลีกเลี่ยง Bear Case\n\n---\n\n# ROUND 8 — BULL / BASE / BEAR\n\nใช้ Scenario Framework จาก Source เท่านั้น\n\n## 🟢 BULL — 45%\n\nTriggers:\n\n* DXY <98\n* US10Y <4.65%\n* Gold >$4,680\n* $4,700 = Bullish Momentum Acceleration\n\nTarget:\n\n$4,720–$4,750\n\n## 🟡 BASE — 45%\n\n* DXY 98.50–99.20\n* US10Y 4.70–4.80%\n* Gold $4,580–$4,680\n* GDX >$98\n\n## 🔴 BEAR — 10%\n\n* DXY >99.80\n* US10Y >4.85%\n* Gold $4,480–$4,500\n\nต้องย้ำว่า Probability เป็น:\n\n> **Analyst-Assigned Strategic Probability**\n\nไม่ใช่ statistical probability\n\n---\n\n# 🐋 FINAL WHALE VERDICT\n\nตอนท้ายให้ Analyst A และ Analyst B ตอบคำถามเดียวกัน:\n\n> **“ถ้าต้องให้คะแนนสถานะทองคำตอนนี้ คุณให้กี่คะแนนจาก 10 และเพราะอะไร?”**\n\nใช้:\n\n> **Gold Market Regime Score: 7.8 / 10**\n\nแต่ต้องระบุว่า:\n\n> **Analyst Subjective Composite Score**\n\nจากนั้นตอบ 3 คำถาม:\n\n### 1. WHAT?\n\nเกิดอะไรขึ้น?\n\n### 2. WHY?\n\nอะไรเป็นตัวขับเคลื่อน?\n\n### 3. WHAT NEXT?\n\nสัปดาห์หน้าต้องจับตาอะไร?\n\n---\n\n# 🎯 FINAL EXECUTION WATCHLIST\n\nต้องปิดรายการด้วย 4 ตัวแปร:\n\n### 🥇 Gold\n\n> $4,700\n\n### ⛏️ GDX\n\n> $108\n\n### 🇺🇸 US 10Y\n\n> 4.80%\n\n### 💵 DXY\n\n> 98.00\n\nให้บอกทั้ง:\n\n**Bullish Trigger**\n\nและ\n\n**Risk Trigger**\n\n---\n\n# 🚨 EVIDENCE DISCIPLINE — สำคัญที่สุด\n\nห้ามสร้างข้อมูลใหม่\n\nห้ามเติมตัวเลขที่ไม่มีใน Source\n\nห้ามสมมติว่า:\n\n> GDX ขึ้น = Institutional Buying Confirmed\n\nห้ามสมมติว่า:\n\n> Gold ขึ้น = Central Banks ซื้อ\n\nห้ามสมมติว่า:\n\n> ETF ขึ้น = ETF Net Inflow\n\nห้ามสมมติว่า:\n\n> Price + OI = Institutional Net Long\n\nห้ามเปลี่ยน:\n\n> `[Inferred]`\n\nเป็น\n\n> `[Confirmed]`\n\nห้ามเปลี่ยน:\n\n> `[Strategic View]`\n\nเป็น\n\n> `[Observed]`\n\nเมื่อข้อมูลยังไม่ยืนยัน ให้พูดว่า:\n\n> **“Data Pending”**\n>\n> **“Unconfirmed”**\n>\n> **“เราไม่สามารถสรุปได้จากข้อมูลชุดนี้”**\n\n---\n\n# 🎧 STYLE OF AUDIO\n\nต้องเป็น:\n\n* Professional\n* Intelligent\n* Conversational\n* Bloomberg / CNBC / Institutional Research style\n* มีการ Debate จริง\n* มี Counterargument\n* ม     let activeVersion = 'v1';

    function saveLocalState() {
      try {
        localStorage.setItem('custom_templates_v2', JSON.stringify(DATA.templates));
      } catch(e){}
    }

    function loadLocalState() {
      try {
        const saved = localStorage.getItem('custom_templates_v2');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (Array.isArray(parsed) && parsed.length > 0) {
            parsed.forEach(pt => {
              const existingIdx = DATA.templates.findIndex(t => t.id === pt.id);
              if (existingIdx >= 0) {
                DATA.templates[existingIdx] = Object.assign({}, DATA.templates[existingIdx], pt);
              } else {
                DATA.templates.push(pt);
              }
            });
          }
        }
      } catch(e){}
    }

    loadLocalState();

    function esc(s) { if (!s) return ''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

      if(n.includes('daily')||n.includes('สรุปจบ')) return '🌍';
      if(n.includes('weekly')||n.includes('รายสัปดาห์')) return '📅';
      if(n.includes('whale')||n.includes('วาฬ')) return '🐋';
      if(n.includes('small cap')||n.includes('radar')) return '📡';
      if(n.includes('hot stock')) return '🔥';
      if(n.includes('พุ่ง')||n.includes('pre-market')||n.includes('pre_market')) return '🚀';
      if(n.includes('ดวงใจ')) return '💖';
      if(n.includes('ขอมา')) return '🎯';
      if(n.includes('หมี')||n.includes('squeeze')) return '🐻';
      if(n.includes('vip')||n.includes('watchlist')) return '👑';
      if(n.includes('vp')||n.includes('opportunity')) return '🏆';
      if(n.includes('global')||n.includes('recap')) return '🌐';
      if(n.includes('next')) return '🔮';
      if(n.includes('astro')) return '✨';
      if(n.includes('calendar')||n.includes('economic')) return '📆';
      if(n.includes('ไทย')||n.includes('thai')) return '🇹🇭';
      if(n.includes('oversold')) return '📉';
      if(n.includes('cosmic')||n.includes('signal')) return '🌠';
      return '📋';
    }
    function getBadge(id,name) {
      const n=(name||'').toLowerCase();
      if(n.includes('daily')||n.includes('สรุปจบ')||n.includes('hot stock')||n.includes('พุ่ง')||n.includes('small cap')) return {text:'รายวัน',cls:'badge-daily'};
      if(n.includes('weekly')||n.includes('รายสัปดาห์')||n.includes('whale')||n.includes('วาฬ')||n.includes('recap')||n.includes('next')||n.includes('astro')||n.includes('calendar')||n.includes('oversold')||n.includes('cosmic')||n.includes('ไทย')) return {text:'รายสัปดาห์',cls:'badge-weekly'};

    function statusBadge(st) {

          '</div>'+

    function getAvailableVersionsForTemplate(t) {
      const vers = new Set(['v1', 'v2', 'v3']);
      const regex = new RegExp('^(search|audio|report|info)Prompt(V[0-9]+)$', 'i');
      Object.keys(t).forEach(k => {
        const m = k.match(regex);
        if (m) {
          vers.add(m[2].toLowerCase());
        }
      });
      return Array.from(vers).sort((a,b) => {
        const numA = parseInt(a.replace('v',''))||0;
        const numB = parseInt(b.replace('v',''))||0;
        return numA - numB;
      });
    }

    function getPromptPropKey(promptType) {
      const keyMap = { 
        search: 'searchPrompt', 
        audio: 'audioPrompt', 
        report: 'reportPrompt', 
        info: 'infoPrompt'
      };
      if (keyMap[promptType]) return keyMap[promptType];

      const match = promptType.match(/^(search|audio|report|info)(Vd+)$/i);
      if (match) {
        return match[1] + 'Prompt' + match[2].toUpperCase();
      }
      return promptType;
    }

    window.switchVersion = function(ver) {
      activeVersion = ver.toLowerCase();
      openDetail(currentDetailIdx);
    }

    window.addNewVersion = function(templateIdx) {
      const vName = prompt('ระบุชื่อ Version ใหม่ที่ต้องการเพิ่ม (เช่น V4, V5):', 'V4');
      if (!vName) return;
      let cleanVer = vName.trim().toLowerCase();
      if (!cleanVer.startsWith('v')) {
        cleanVer = 'v' + cleanVer;
      }
      activeVersion = cleanVer;
      
      const t = DATA.templates[templateIdx];
      const suffix = cleanVer.toUpperCase();
      if (t['searchPrompt' + suffix] === undefined) t['searchPrompt' + suffix] = '';
      if (t['audioPrompt' + suffix] === undefined) t['audioPrompt' + suffix] = '';
      if (t['reportPrompt' + suffix] === undefined) t['reportPrompt' + suffix] = '';
      if (t['infoPrompt' + suffix] === undefined) t['infoPrompt' + suffix] = '';

      saveLocalState();
      openDetail(templateIdx);
      showToast('✨ เพิ่ม ' + cleanVer.toUpperCase() + ' เรียบร้อย — พิมพ์ Prompt แล้วกด Save เพื่อบันทึก');
    }

    function openDetail(idx) {

      const t = DATA.templates[idx];
      const wfs = DATA.workflowsByTemplate[t.id] || [];

        return t[key + 'Prompt' + keySuffix] || '';

          '<div class="modal-body">'+
            '<h3 class="section-title" style="margin-bottom:12px">🎛️ การตั้งค่า Prompt ('+activeVersion.toUpperCase()+') <span style="font-size:.78rem;color:var(--text-muted);font-weight:400">— แก้ไขได้ กด Save เพื่อบันทึก</span></h3>'+
            '<div class="version-selector">'+versionButtonsHtml+'</div>'+
            '<div class="prompt-accordion">'+
            prompts.map(p => {
              const hasVal = !!(p.val && p.val.trim());
              const typeKey = p.key + (activeVersion === 'v1' ? '' : activeVersion.toUpperCase());
              return '<div class="prompt-section '+p.cls+'">'+
                '<button class="prompt-header-btn" onclick="toggleAccordion(this)"><span>'+p.label+'</span><span class="prompt-status">'+(hasVal?'✅ ตั้งค่าแล้ว':'⬜ ยังไม่ได้ตั้ง')+'</span><span class="chevron">▼</span></button>'+
                '<div class="prompt-body">'+
                  '<div class="prompt-actions">'+
                    '<button class="btn-sm btn-copy" onclick="copyText(\'ta_'+t.id+'_'+typeKey+'\',this)">📋 Copy</button>'+
                    '<button class="btn-sm btn-save" id="save_'+t.id+'_'+typeKey+'" onclick="savePrompt(\''+t.id+'\',\''+typeKey+'\','+idx+')" disabled>💾 Save</button>'+

      const modalHtml = '<div class="modal-overlay show" id="add-template-modal" onclick="if(event.target===this)closeAddModal()">'+
        '<div class="modal-content" style="max-width:720px" onclick="event.stopPropagation()">'+
          '<div class="modal-header"><div class="modal-title-group"><span class="modal-icon">➕</span><div><h2>เพิ่มรายการผลิตคลิปใหม่</h2><span class="modal-id">สร้างรายการแบบแผนคัดสรรและวิเคราะห์ด้วย NotebookLM</span></div></div><button class="modal-close" onclick="closeAddModal()">&times;</button></div>'+
            '<form onsubmit="submitNewTemplate(event)">'+
              '<div class="form-group">'+
                '<label class="form-label">ชื่อรายการ (เช่น This Week’s Watchlist — หุ้นอเมริกา):</label>'+
                '<input type="text" class="form-input" id="new-template-name" placeholder="ตัวอย่าง: This Week’s Watchlist — หุ้นอเมริกา" oninput="autoGenerateId()" required>'+
              '</div>'+
              '<div class="form-group">'+
                '<label class="form-label">ID ของรายการ <span style="font-size:.78rem;color:#818cf8;margin-left:6px">⚡ สร้างให้อัตโนมัติ</span>:</label>'+
                '<input type="text" class="form-input" id="new-template-id" placeholder="ระบบจะสร้าง ID ให้อัตโนมัติ..." readonly style="background:rgba(255,255,255,0.05);color:var(--primary-light);cursor:default">'+
              '</div>'+
              '<div class="form-group">'+
                '<label class="form-label">Prompt ค้นหาข่าว (Search Prompt):</label>'+
                '<textarea class="form-textarea" id="new-search-prompt" placeholder="ใส่ข้อความคำสั่งสำหรับการค้นหาข้อมูลข่าว..."></textarea>'+
              '</div>'+
              '<div class="form-group">'+
                '<label class="form-label">Prompt Audio Overview:</label>'+
                '<textarea class="form-textarea" id="new-audio-prompt" placeholder="ใส่สคริปต์แนะนำผู้ดำเนินรายการ..."></textarea>'+
              '</div>'+
              '<div class="form-group">'+
                '<label class="form-label">Prompt Report Facebook:</label>'+
                '<textarea class="form-textarea" id="new-report-prompt" placeholder="ใส่สคริปต์โพสต์บทวิเคราะห์..."></textarea>'+
              '</div>'+
              '<div class="form-group">'+
                '<label class="form-label">Prompt Infographic:</label>'+
                '<textarea class="form-textarea" id="new-info-prompt" placeholder="ใส่คำสั่งสร้างกราฟิกสรุปข้อมูล..."></textarea>'+
              '</div>'+
              '<div style="text-align:right;margin-top:20px">'+
                '<button type="button" class="btn-sm" style="margin-right:10px" onclick="closeAddModal()">ยกเลิก</button>'+
                '<button type="submit" class="btn-primary-add" id="btn-submit-template">💾 บันทึกรายการใหม่</button>'+
              '</div>'+
            '</form>'+
          '</div>'+
        '</div>'+
      '</div>';
      document.getElementById('add-modal-container').innerHTML = modalHtml;
    }

    window.closeAddModal = function() {
      document.getElementById('add-modal-container').innerHTML = '';
    }

    window.submitNewTemplate = async function(e) {
      e.preventDefault();
      const id = document.getElementById('new-template-id').value.trim();
      const name = document.getElementById('new-template-name').value.trim();
      const searchPrompt = document.getElementById('new-search-prompt').value;
      const audioPrompt = document.getElementById('new-audio-prompt').value;
      const reportPrompt = document.getElementById('new-report-prompt').value;
      const infoPrompt = document.getElementById('new-info-prompt').value;

      const btn = document.getElementById('btn-submit-template');
      btn.disabled = true;
      btn.textContent = '⏳ กำลังบันทึก...';

      const cleanId = id.toLowerCase().replace(/\s+/g, '_');
      const newTmpl = {
        id: cleanId,
        name: name,
        searchPrompt: searchPrompt || '',
        audioPrompt: audioPrompt || '',
        reportPrompt: reportPrompt || '',
        infoPrompt: infoPrompt || ''
      };

      const existingIdx = DATA.templates.findIndex(t => t.id === cleanId);
      if (existingIdx >= 0) {
        DATA.templates[existingIdx] = Object.assign(DATA.templates[existingIdx], newTmpl);
      } else {
        DATA.templates.push(newTmpl);
      }
      saveLocalState();
      render();
      closeAddModal();

      try {
        const resp = await fetch('/api/add-template', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: cleanId, name, searchPrompt, audioPrompt, reportPrompt, infoPrompt })
        });
        const result = await resp.json();
        if (result.success) {
          showToast('🎉 เพิ่มรายการใหม่ "' + name + '" เรียบร้อย!');
          return;
        }
      } catch (err) {
        showToast('🎉 เพิ่มรายการใหม่ "' + name + '" เรียบร้อย!');
      }
    }

    function toggleAccordion(btn) {
      const body = btn.nextElementSibling;
      body.classList.toggle('show');
      btn.classList.toggle('open');
    }

    function toggleLogs(e, id) {
      e.stopPropagation();
      const row = document.getElementById(id);
      if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
    }

    function copyText(taId, btn) {
      const ta = document.getElementById(taId);
      navigator.clipboard.writeText(ta.value).then(() => {
        btn.textContent = '✅ Copied!';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '📋 Copy'; btn.classList.remove('copied'); }, 2000);
      });
    }

    function onPromptEdit(templateId, promptType) {
      const saveBtn = document.getElementById('save_'+templateId+'_'+promptType);
      if (saveBtn) saveBtn.disabled = false;
    }

    async function savePrompt(templateId, promptType, templateIdx) {
      const ta = document.getElementById('ta_'+templateId+'_'+promptType);
      const saveBtn = document.getElementById('save_'+templateId+'_'+promptType);
      const value = ta.value;

      saveBtn.disabled = true;
      saveBtn.textContent = '⏳ กำลังบันทึก...';

      const propKey = getPromptPropKey(promptType);
      DATA.templates[templateIdx][propKey] = value;
      saveLocalState();

      saveBtn.textContent = '✅ บันทึกแล้ว!';
      saveBtn.classList.add('saved');
      showToast('💾 บันทึก Prompt สำเร็จ!');

      const section = ta.closest('.prompt-section');
      const statusEl = section.querySelector('.prompt-status');
      if (statusEl) statusEl.textContent = value.trim() ? '✅ ตั้งค่าแล้ว' : '⬜ ยังไม่ได้ตั้ง';

      ta.classList.toggle('no-data', !value.trim());

      setTimeout(() => {
        saveBtn.textContent = '💾 Save';
        saveBtn.classList.remove('saved');
        saveBtn.disabled = false;
      }, 2000);

      render();

      try {
        await fetch('/api/save-prompt', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ templateId, promptType, value })
        });
      } catch (e) {}
    }

    function filterCards() {
      const q = document.getElementById('album-search').value.trim().toLowerCase();
      const cards = document.querySelectorAll('.album-card');
      let found = 0;
      cards.forEach(c => {
        const name = (c.getAttribute('data-name')||'').toLowerCase();
        const id = (c.getAttribute('data-id')||'').toLowerCase();
        if (name.includes(q) || id.includes(q)) { c.style.display=''; found++; }
        else { c.style.display='none'; }
      });
      document.getElementById('no-results').style.display = found===0 ? 'block' : 'none';
    }

    function showToast(msg, isErr=false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isErr ? ' error' : '');
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    async function deployToGithub() {
      const btn = document.getElementById('btn-deploy');
      btn.textContent = '⏳ Deploying...';
      btn.classList.add('deploying');
      try {
        const resp = await fetch('/api/deploy', { method: 'POST' });
        const res = await resp.json();
        if (res.success) {
          btn.textContent = '✅ ' + (res.message || 'Deployed!');
          btn.classList.add('success');
          showToast('🚀 Deploy ขึ้น GitHub สำเร็จ!');
        } else {
          throw new Error(res.error || 'Deploy failed');
        }
      } catch (e) {
        btn.textContent = '❌ Deploy Failed';
        showToast('❌ Deploy ล้มเหลว: ' + e.message, true);
      }
      setTimeout(() => {
        btn.textContent = '🚀 Deploy';
        btn.classList.remove('deploying', 'success');
      }, 3000);
    }

    render();
  
  </script>
</body>
</html>
